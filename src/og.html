<!DOCTYPE html>
<!-- Source for og.png (link-preview image, 1200x630). Render: headless Chrome screenshot at 1200x630. -->
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #0B1222; color: #EEF1F6; font-family: "Inter", sans-serif; position: relative; }
body::before { content: ""; position: absolute; right: -120px; top: -160px; width: 860px; height: 900px;
  background: radial-gradient(closest-side, rgba(47,99,242,.42), transparent 72%); }
.wrap { position: relative; display: grid; grid-template-columns: 1fr 470px; gap: 56px; padding: 64px 72px; height: 100%; align-items: center; }
.mark { display: flex; align-items: center; gap: 14px; font-family: "Inter Display"; font-weight: 900; font-size: 40px; letter-spacing: -0.01em; }
.mark svg { width: 46px; height: 46px; }
h1 { margin-top: 52px; font-family: "Inter Display"; font-weight: 900; font-size: 86px; line-height: 0.98; letter-spacing: -0.035em; }
.sub { margin-top: 30px; font-size: 23px; white-space: nowrap; color: #A9B4CA; font-weight: 500; }
.pill { display: inline-block; margin-top: 30px; padding: 14px 22px; border-radius: 14px; background: #fff; color: #0B1222; font-weight: 800; font-size: 22px; }
.card { background: #111A2E; border: 1px solid #24304C; border-radius: 28px; padding: 30px 32px; box-shadow: 0 60px 100px -50px rgba(47,99,242,.7); }
.row { display: flex; justify-content: space-between; align-items: baseline; }
.lift { font-family: "Inter Display"; font-weight: 800; font-size: 28px; }
.small { color: #8E9AB3; font-size: 17px; }
.set { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; padding: 18px 4px; border-top: 1px solid #1F2A42; }
.set:last-of-type { border-bottom: 1px solid #1F2A42; }
.n { color: #8E9AB3; font-size: 16px; }
.load { font-family: "Inter Display"; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.tag { font-size: 17px; color: #8E9AB3; }
.missed .load { color: #5F6B86; text-decoration: line-through; text-decoration-color: #FF8A4C; text-decoration-thickness: 3px; }
.missed .tag { color: #FF8A4C; }
.next { margin: 0 -32px; padding: 18px 36px; background: linear-gradient(90deg, rgba(47,99,242,.25), rgba(47,99,242,0) 85%); box-shadow: inset 4px 0 0 #2F63F2; border-top-color: transparent; }
.next .tag { color: #8FA9FF; font-weight: 700; }
.coach { margin-top: 20px; display: flex; gap: 12px; align-items: flex-start; background: #0D1526; border-radius: 16px; padding: 16px 18px; font-size: 18px; line-height: 1.4; color: #D5DAE3; }
.dot { flex: none; width: 28px; height: 28px; border-radius: 8px; background: #2F63F2; color: #fff; font-weight: 800; font-size: 14px; display: grid; place-items: center; }
</style></head>
<body>
<div class="wrap">
  <div>
    <div class="mark">
      <svg viewBox="0 0 32 32"><path d="M4 9h24" stroke="#EEF1F6" stroke-width="3" stroke-linecap="round"/><path d="M16 9v13" stroke="#3D6BF5" stroke-width="3" stroke-linecap="round"/><path d="M8 19c2 5 5 8 8 8s6-3 8-8" fill="none" stroke="#EEF1F6" stroke-width="3" stroke-linecap="round"/></svg>
      Kedge
    </div>
    <h1>Life happens.<br>Your coach adapts.</h1>
    <p class="sub">Training, nutrition and recovery, all in one coach.</p>
    <span class="pill">Join the waitlist · first month free</span>
  </div>
  <div class="card">
    <div class="row"><span class="lift">Bench press</span><span class="small">3 × 5</span></div>
    <div style="margin-top:14px">
      <div class="set"><span class="n">Set 1</span><span class="load">225 × 5</span><span class="tag">RPE 8</span></div>
      <div class="set missed"><span class="n">Set 2</span><span class="load">225 × 2</span><span class="tag">Missed 3</span></div>
      <div class="set next"><span class="n">Set 3</span><span class="load">205 × 5</span><span class="tag">Adjusted</span></div>
    </div>
    <div class="coach"><span class="dot">K</span><span>Rep 2 slowed down. Dropping 20 lb to keep you at 5 reps.</span></div>
  </div>
</div>
</body></html>
