<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Kedge link preview (source for og.png)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
html, body { margin: 0; background: #fff; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #E6E7E2; color: #15171A; font-family: Barlow, sans-serif; }
.mark { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font: 900 40px/1 "Big Shoulders Display", sans-serif; letter-spacing: .01em; }
.mark svg { width: 38px; height: 38px; }
h1 { position: absolute; left: 64px; top: 138px; width: 600px; margin: 0; font: 900 104px/.92 "Big Shoulders Display", sans-serif; letter-spacing: -.005em; }
.sub { position: absolute; left: 66px; top: 448px; width: 600px; margin: 0; white-space: nowrap; font-size: 24px; line-height: 1.3; font-weight: 500; color: #4A4E55; }
.pill { position: absolute; left: 64px; top: 514px; height: 52px; padding: 0 24px; border-radius: 6px; background: #15171A; color: #fff; display: flex; align-items: center; font-size: 22px; font-weight: 700; }
.plate { position: absolute; right: -150px; top: -65px; width: 760px; height: 760px; border-radius: 50%; background: #D2262F; box-shadow: inset 0 0 0 26px #B81F27, inset 0 0 0 30px #D2262F, inset 0 0 0 150px #D2262F, inset 0 0 0 154px #B81F27; }
.plate::after { content: ""; position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px; border-radius: 50%; background: #C9CBC4; box-shadow: inset 0 0 0 14px #9A9D96; }
.phone { position: absolute; right: 96px; top: 96px; width: 380px; border-radius: 30px; background: #0E1116; color: #ECEFF4; padding: 26px 24px 24px; box-shadow: 0 30px 60px rgba(21, 23, 26, .35); }
.phone .title { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 26px; padding-bottom: 14px; border-bottom: 1px solid #252A35; }
.phone .title span { font-size: 16px; font-weight: 500; color: #8C94A3; }
.row { display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px solid #252A35; }
.row small { width: 46px; font-size: 15px; color: #8C94A3; }
.row b { flex: 1; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row em { font-style: normal; font-size: 15px; font-weight: 600; color: #8C94A3; }
.row.missed b { color: #8C94A3; text-decoration: line-through; text-decoration-color: #FF8A4C; text-decoration-thickness: 3px; }
.row.missed em { color: #FF8A4C; }
.row.now { margin: 0 -24px; padding: 15px 24px; background: #171B23; box-shadow: inset 4px 0 0 #3D6BF5; }
.row.now em { color: #8FA9FF; }
.note { margin-top: 16px; background: #171B23; border-radius: 14px; padding: 14px 16px; font-size: 17px; line-height: 1.35; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="plate"></div>
  <div class="mark">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 9h24" stroke="#15171A" stroke-width="3.4" stroke-linecap="round"/><path d="M16 9v13" stroke="#2450E0" stroke-width="3.4" stroke-linecap="round"/><path d="M8 19c2 5 5 8 8 8s6-3 8-8" fill="none" stroke="#15171A" stroke-width="3.4" stroke-linecap="round"/></svg>
    Kedge
  </div>
  <h1>Train the day you actually have.</h1>
  <p class="sub">An AI strength coach that adapts to your real week.</p>
  <div class="pill">Join the waitlist. First month free.</div>
  <div class="phone">
    <div class="title">Bench press <span>3 × 5</span></div>
    <div class="row"><small>Set 1</small><b>225 × 5</b><em>RPE 8</em></div>
    <div class="row missed"><small>Set 2</small><b>225 × 2</b><em>Missed 3</em></div>
    <div class="row now"><small>Set 3</small><b>205 × 5</b><em>Adjusted</em></div>
    <div class="note">Rep 2 slowed down. Dropping 20 lb to keep you at 5 reps.</div>
  </div>
</div>
</body>
</html>
